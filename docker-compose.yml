services:
  postgres:
    image: postgres:17-alpine
    container_name: tenantforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenantforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/tenantforge
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
    volumes:
      - ./db/migration:/flyway/sql
    depends_on:
      - postgres
    profiles: [tools]

volumes:
  pgdata:
